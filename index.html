<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winsim Gym</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
</head>
<body>
    <nav>
        <div class="nav-logo" onclick="showPage('home')">WINSIM <span>GYM</span></div>
        <div class="nav-links">
            <button class="nav-link active" onclick="showPage('home')" id="nav-home">Home</button>
            <button class="nav-link" onclick="showPage('plans')" id="nav-plans">Plans</button>
            <button class="nav-link" onclick="showPage('schedule')" id="nav-schedule">Schedule</button>
            <button class="nav-link" onclick="showPage('trainers')" id="nav-trainers">Trainers</button>
            <button class="nav-link" onclick="showPage('contact')" id="nav-contact">Contact</button>
        </div>
        <div class="nav-actions" id="nav-actions">
            <button class="btn btn-outline btn-sm" onclick="openModal('login')">Log In</button>
            <button class="btn btn-dark btn-sm" onclick="openModal('register')">Join Now</button>
        </div>
    </nav>

    <div class="page active" id="page-home">
        <div class="hero">
            <div>
                <div class="hero-badge">NOW OPEN!</div>
                <h1>Train Smarter.<br><span class="muted">Live Stronger.</span></h1>
                <p class="hero-desc">A premium fitness experience designed for real results. Expert coaches, science-backed programmes, and a community that pushes you forward.</p>
                <div class="hero-actions">
                    <button class="btn btn-dark" onclick="showPage('plans')">View Membership Plans</button>
                    <button class="btn btn-outline" onclick="showPage('schedule')">See Class Schedule</button>
                </div>
                </div>
                <div class="hero-stats">
                <div class="stat-card"><div class="stat-num">4+</div><div class="stat-label">Expert Trainers</div></div>
                <div class="stat-card"><div class="stat-num">10+</div><div class="stat-label">Weekly Classes</div></div>
                <div class="stat-card"><div class="stat-num" id="stat-members">0</div><div class="stat-label">Members</div></div>
                <div class="stat-card"><div class="stat-num">3</div><div class="stat-label">Membership Tiers</div></div>
            </div>
        </div>
    </div>
    
</body>
<footer>

</footer>
<script src="index.js"></script>
</html>
